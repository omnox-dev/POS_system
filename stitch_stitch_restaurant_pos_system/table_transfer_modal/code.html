<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>BistroFlow - Table Transfer</title>

                      "error": "#ba1a1a",

                      "surface": "#f8f9fa",
                      "on-secondary-fixed": "#301400",
                      "error-container": "#ffdad6",

                      "tertiary-fixed": "#7efba4",
                      "tertiary-fixed-dim": "#61de8a",

              "borderRadius": {

              "spacing": {

                      "stack-lg": "1.5rem",
                      "touch-target-min": "48px",
                      "margin-desktop": "2rem",
                      "stack-sm": "0.5rem",
                      "gutter": "1rem",
                      "stack-md": "1rem"
              },
              "fontFamily": {
                      "body-md": [

                      ],
                      "headline-md": [

<body class="bg-background text-on-background min-h-screen font-body-md antialiased flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-surface-tint/50 backdrop-blur-sm z-40"></div>
<!-- Modal Container -->
<div class="relative bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-5xl z-50 overflow-hidden flex flex-col max-h-[90vh]">
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-surface-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">move_up</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Table Transfer</h2>
</div>
<button aria-label="Close modal" class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Content Layout (Bento Grid Style) -->
<div class="flex-1 overflow-y-auto p-6 bg-surface grid grid-cols-1 lg:grid-cols-12 gap-6">
<!-- Left Column: Source Info & Controls -->
<div class="lg:col-span-4 flex flex-col gap-6">
<!-- From Table Card -->
<div class="bg-surface-container-lowest rounded-lg border border-surface-variant p-5 shadow-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-4">Transferring From</h3>
<div class="flex items-center gap-4">
<div class="h-16 w-16 bg-secondary-container text-on-secondary-container rounded-lg flex items-center justify-center border-2 border-secondary">
<span class="font-headline-lg text-headline-lg">12</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-on-surface">Main Dining Room</p>
<div class="flex items-center gap-1.5 mt-1">
<span class="h-2 w-2 rounded-full bg-secondary"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Occupied • 4 Guests</span>
</div>
</div>
</div>
</div>
<!-- Active Bill Summary -->
<div class="bg-surface-container-lowest rounded-lg border border-surface-variant p-5 shadow-sm flex-1">
<div class="flex items-center justify-between mb-4">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Active Bill</h3>
<span class="font-data-mono text-data-mono text-on-surface-variant">#INV-8492</span>
</div>
<div class="space-y-3 mb-6 max-h-40 overflow-y-auto pr-2">
<div class="flex justify-between items-start">
<div class="flex gap-2">
<span class="font-data-mono text-data-mono text-on-surface-variant">2x</span>
<span class="font-body-md text-body-md text-on-surface">Steak Frites</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$76.00</span>
</div>
<div class="flex justify-between items-start">
<div class="flex gap-2">
<span class="font-data-mono text-data-mono text-on-surface-variant">1x</span>
<span class="font-body-md text-body-md text-on-surface">Caesar Salad</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$14.00</span>
</div>
<div class="flex justify-between items-start">
<div class="flex gap-2">
<span class="font-data-mono text-data-mono text-on-surface-variant">3x</span>
<span class="font-body-md text-body-md text-on-surface">House Red (Glass)</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$36.00</span>
</div>
</div>
<div class="border-t border-surface-variant pt-3 flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface">Current Total</span>
<span class="font-headline-md text-headline-md text-secondary">$126.00</span>
</div>
</div>
<!-- Transfer Reason -->
<div class="bg-surface-container-lowest rounded-lg border border-surface-variant p-5 shadow-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2" for="transfer-reason">Reason for Transfer</label>
<div class="relative">
<select class="w-full h-touch-target-min appearance-none bg-surface border border-outline-variant rounded-md pl-4 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary cursor-pointer" id="transfer-reason">
<option value="guest_request">Guest Request</option>
<option value="better_view">Better View</option>
<option value="table_issue">Table/Draft Issue</option>
<option value="combine_party">Combine with another party</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Right Column: Interactive Floor Plan -->
<div class="lg:col-span-8 bg-surface-container-lowest rounded-lg border border-surface-variant shadow-sm flex flex-col">
<div class="flex items-center justify-between p-4 border-b border-surface-variant">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Select Destination Table</h3>
<div class="flex gap-2">
<button class="px-4 py-2 bg-surface-container-high rounded-md font-label-bold text-label-bold text-on-surface hover:bg-surface-variant transition-colors">Main Floor</button>
<button class="px-4 py-2 bg-surface rounded-md font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high transition-colors">Patio</button>
</div>
</div>
<!-- Floor Plan Area (Simplified Grid representation) -->
<div class="flex-1 p-6 bg-surface-container-low min-h-[400px] relative rounded-b-lg overflow-hidden">
<!-- Legend -->
<div class="absolute top-4 right-4 bg-surface-container-lowest p-3 rounded-md shadow-sm border border-surface-variant flex gap-4 z-10">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-tertiary-container border border-on-tertiary-container"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Available</span>
</div>
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-secondary-container border border-secondary"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Occupied</span>
</div>
</div>
<!-- Grid Layout -->
<div class="grid grid-cols-4 gap-6 h-full content-start pt-12">
<!-- Table 20 (Available) -->
<button class="aspect-square bg-surface-container-lowest rounded-xl border-2 border-on-tertiary-container hover:bg-surface-variant transition-colors flex flex-col items-center justify-center relative group">
<span class="font-headline-md text-headline-md text-on-surface">20</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">4 Seats</span>
<div class="absolute inset-0 bg-secondary/10 opacity-0 group-hover:opacity-100 rounded-xl transition-opacity flex items-center justify-center">
<span class="font-label-bold text-label-bold text-secondary">Select</span>
</div>
</button>
<!-- Table 21 (Available - Selected State Example) -->
<button class="aspect-square bg-secondary-fixed rounded-xl border-2 border-secondary flex flex-col items-center justify-center relative shadow-sm ring-2 ring-secondary ring-offset-2 ring-offset-surface-container-low">
<span class="absolute top-2 right-2 material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-md text-headline-md text-on-secondary-fixed">21</span>
<span class="font-label-sm text-label-sm text-on-secondary-fixed-variant mt-1">4 Seats</span>
</button>
<!-- Table 22 (Occupied) -->
<button class="aspect-square bg-surface-container-lowest rounded-xl border border-outline-variant opacity-50 cursor-not-allowed flex flex-col items-center justify-center">
<span class="font-headline-md text-headline-md text-on-surface">22</span>
<span class="font-label-sm text-label-sm text-error mt-1">Occupied</span>
</button>
<!-- Table 23 (Available) -->
<button class="aspect-square bg-surface-container-lowest rounded-xl border-2 border-on-tertiary-container hover:bg-surface-variant transition-colors flex flex-col items-center justify-center relative group">
<span class="font-headline-md text-headline-md text-on-surface">23</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">2 Seats</span>
<div class="absolute inset-0 bg-secondary/10 opacity-0 group-hover:opacity-100 rounded-xl transition-opacity flex items-center justify-center">
<span class="font-label-bold text-label-bold text-secondary">Select</span>
</div>
</button>
<!-- Table 24 (Available) -->
<button class="aspect-square bg-surface-container-lowest rounded-xl border-2 border-on-tertiary-container hover:bg-surface-variant transition-colors flex flex-col items-center justify-center relative group">
<span class="font-headline-md text-headline-md text-on-surface">24</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">6 Seats</span>
<div class="absolute inset-0 bg-secondary/10 opacity-0 group-hover:opacity-100 rounded-xl transition-opacity flex items-center justify-center">
<span class="font-label-bold text-label-bold text-secondary">Select</span>
</div>
</button>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<footer class="px-6 py-4 border-t border-surface-variant bg-surface-container-lowest flex justify-end gap-4">
<button class="h-touch-target-min px-6 rounded-md font-label-bold text-label-bold text-on-surface border border-outline hover:bg-surface-container-high transition-colors">
                Cancel
            </button>
<button class="h-touch-target-min px-8 rounded-md font-label-bold text-label-bold bg-secondary text-on-secondary hover:bg-on-secondary-container transition-colors flex items-center gap-2 shadow-sm">
                Confirm Transfer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
</div>
</body></html>
