<script>
        // Simple JS to simulate PIN entry feedback
        const buttons = document.querySelectorAll('button:not([aria-label="Backspace"])');
        const backspace = document.querySelector('button[aria-label="Backspace"]');
        const dots = document.querySelectorAll('.pin-dot');
        let currentPinLength = 0;
        const maxPinLength = 4;

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentPinLength) {
                    dot.classList.add('filled', 'bg-secondary', 'border-secondary');
                } else {
                    dot.classList.remove('filled', 'bg-secondary', 'border-secondary');
                }
            });
            
            // Simulate login successful visual if 4 digits
            if (currentPinLength === maxPinLength) {
                setTimeout(() => {
                    dots.forEach(dot => {
                        dot.classList.remove('bg-secondary', 'border-secondary');
                        dot.classList.add('bg-on-tertiary-container', 'border-on-tertiary-container');
                    });
                }, 200);
                setTimeout(() => {
                    currentPinLength = 0;
                    updateDots();
                }, 800);
            }
        }

        buttons.forEach(btn => {
            if(btn.textContent.trim() !== "" && btn.textContent.trim() !== ".") {
                btn.addEventListener('click', () => {
                    if (currentPinLength < maxPinLength) {
                        currentPinLength++;
                        updateDots();
                    }
                });
            }
        });

        if (backspace) {
            backspace.addEventListener('click', () => {
                if (currentPinLength > 0) {
                    currentPinLength--;
                    updateDots();
                }
            });
        }
    </script>
